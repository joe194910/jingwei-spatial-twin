# 生产环境关闭详细错误信息，并要求由部署环境提供全部连接密钥。

# Web 错误响应安全配置：禁止向客户端暴露异常消息、参数绑定细节和堆栈。
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

# Spring Boot 生产环境基础设施配置。
spring:
  # MySQL 8.0 生产数据源：连接地址、账号和密码必须由部署环境提供。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${JW_DB_URL}
    username: ${JW_DB_USER}
    password: ${JW_DB_PASSWORD}
  # Redis 生产连接：用于 Sa-Token 会话、权限缓存及后续业务缓存。
  data:
    redis:
      host: ${JW_REDIS_HOST}
      port: ${JW_REDIS_PORT:6379}
      password: ${JW_REDIS_PASSWORD}
      database: ${JW_REDIS_DATABASE:0}
      timeout: 3s
  # 生产环境永久禁止 Flyway clean，数据库变更只能通过新增版本迁移执行。
  flyway:
    clean-disabled: true

# 生产日志配置：框架默认只记录警告，平台业务保留 INFO 级别审计与运行信息。
logging:
  level:
    root: WARN
    com.jingwei.spatial: INFO
